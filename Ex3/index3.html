<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3</title>
</head>
<body>
    <script>
        function trier(tab) {

    for (let i = 0; i < tab.length; i++) {

        for (let j = i + 1; j < tab.length; j++) {

            if (tab[i] > tab[j]) {

                let temp = tab[i];
                tab[i] = tab[j];
                tab[j] = temp;

            }
        }
    }

    return tab;
}
    </script>
</body>
</html>
